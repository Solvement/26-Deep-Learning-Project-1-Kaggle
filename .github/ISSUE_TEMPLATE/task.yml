name: 开发或项目任务
description: 定义开发、缺陷、研究或文档工作的目标、负责人和验收方式。
title: "[任务] "
body:
  - type: dropdown
    id: kind
    attributes:
      label: 任务类型
      options:
        - 功能开发
        - 缺陷修复
        - 调研或设计
        - 环境或自动化
        - 文档或交付
    validations:
      required: true
  - type: textarea
    id: goal
    attributes:
      label: 目标与背景
      description: 要解决什么问题？有哪些已确认的要求或来源？
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: 负责人、范围与依赖
      description: 在 Assignees 中指定一位负责人；说明涉及模块、文件边界和阻塞。
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: 验收标准
      description: 写出可以观察或验证的完成条件。
      placeholder: "- [ ] ..."
    validations:
      required: true
  - type: textarea
    id: validation
    attributes:
      label: 验证与交付方式
      description: 计划运行什么检查，交付什么结果，由谁审查？实际结果后续补充到 PR 或本 Issue。
    validations:
      required: true
