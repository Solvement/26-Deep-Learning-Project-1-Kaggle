[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cifar-resnet-project"
version = "0.1.0"
description = "Reproducible, from-scratch CIFAR-10 residual-network experiments"
requires-python = ">=3.10"
dependencies = ["torch>=2.4", "torchvision>=0.19", "numpy>=1.26", "Pillow>=10"]

[project.optional-dependencies]
notebooks = ["jupyterlab>=4", "ipykernel>=6", "matplotlib>=3.8", "nbformat>=5", "nbclient>=0.10"]
download = ["kaggle>=2.2"]

[tool.setuptools.packages.find]
include = ["cifar_project*"]
